name: Update action days

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 1 * *'
  push:
    branches:
      - aktionstage-welcher-tag-ist-heute
    paths:
      - 'scripts/import-welcher-tag-ist-heute.mjs'
      - 'scripts/export-welcher-tag-md.mjs'
      - '.github/workflows/update-action-days.yml'

permissions:
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Export review markdown
        env:
          IMPORT_CONCURRENCY: '6'
          IMPORT_DELAY_MS: '120'
        run: node scripts/export-welcher-tag-md.mjs
      - name: Test and build
        run: |
          npm test
          npm run build
      - name: Commit review markdown
        run: |
          if [ -z "$(git status --porcelain -- aktionstage_welcher_tag_pruefung.md)" ]; then
            echo 'No review markdown changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add aktionstage_welcher_tag_pruefung.md
          git commit -m 'docs: refresh action-day review markdown [skip ci]'
          git push
