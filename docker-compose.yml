services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: skalironauten-sync-helper
    ports:
      - "3001:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:80"]
      interval: 30s
      timeout: 5s
      retries: 3
